<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Resident Registration</mat-card-title>
      <mat-card-subtitle>Join your housing society</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName">
          </mat-form-field>
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName">
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
          <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Society Code</mat-label>
            <input matInput formControlName="societyCode">
          </mat-form-field>
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Flat Number</mat-label>
            <input matInput formControlName="flatNumber">
          </mat-form-field>
        </div>

        <div *ngIf="error" class="error-msg">{{error}}</div>

        <button mat-flat-button color="primary" type="submit" [disabled]="registerForm.invalid || loading" class="full-width register-btn">
          {{loading ? 'Registering...' : 'Register as Resident'}}
        </button>
        <div class="login-link">
          Already have an account? <a routerLink="/login">Login here</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
