services:
  # Backend Web Service - ASP.NET Core API
  - type: web
    name: society-management-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: SocietyManagementApi
      - key: Jwt__Audience
        value: SocietyManagementApiUsers

  # Frontend Static Site - Angular 22
  - type: web
    name: society-management-ui
    runtime: static
    plan: free
    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist/society-management-app/browser

    envVars:
      - key: NODE_VERSION
        value: "24.18.0"

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
