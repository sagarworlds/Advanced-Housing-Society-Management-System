services:
  # 1. Backend Service
  - type: web
    name: society-management-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: SocietyManagementApi
      - key: Jwt__Audience
        value: SocietyManagementApiUsers

  # 2. Frontend Static Site (Angular PWA)
  - type: web
    runtime: static
    name: society-management-ui
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/society-management-app/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
